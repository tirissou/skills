<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f7f8fa;
    --fg: #14161a;
    --muted: #5c6370;
    --border: #e2e5ea;
    --accent: #0b5fff;
    --ok-fg: #0a6c34;
    --ok-bg: #e7f6ec;
    --bad-fg: #b3261e;
    --bad-bg: #fdecea;
    --warn-fg: #8a5a00;
    --warn-bg: #fdf3e2;
    --code-bg: #f2f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f25;
      --fg: #e6e8ec;
      --muted: #9aa1ad;
      --border: #2c313a;
      --accent: #6aa3ff;
      --ok-fg: #7ee0a5;
      --ok-bg: #12301f;
      --bad-fg: #ff9b93;
      --bad-bg: #381916;
      --warn-fg: #f0c169;
      --warn-bg: #33270f;
      --code-bg: #1a1d23;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 5rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header, main { max-width: 60rem; margin: 0 auto; }
  header { border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; }
  h1 { font-size: 1.6rem; margin: 0 0 0.35rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.15rem; margin: 2.5rem 0 0.75rem; padding-top: 0.4rem; }
  h3 { font-size: 1rem; margin: 1.5rem 0 0.5rem; color: var(--muted); font-weight: 600; }
  .subtitle { margin: 0; color: var(--muted); font-size: 0.9rem; }
  p { margin: 0.6rem 0; }
  a { color: var(--accent); }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.875em; }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    overflow-x: auto;
    font-size: 0.82rem;
    line-height: 1.5;
  }
  pre code { background: none; padding: 0; font-size: inherit; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  .scroll { overflow-x: auto; margin: 0.75rem 0; }
  th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .pass { background: var(--ok-bg); color: var(--ok-fg); }
  .fail { background: var(--bad-bg); color: var(--bad-fg); }
  .warn { background: var(--warn-bg); color: var(--warn-fg); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    margin: 1rem 0;
  }
  .panel.alert { border-color: var(--bad-fg); }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); }
  .mermaid { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; overflow-x: auto; }
  .mermaid svg { max-width: 100%; height: auto; }
  ul, ol { padding-left: 1.3rem; }
  li { margin: 0.3rem 0; }
  .muted { color: var(--muted); }
  footer { max-width: 60rem; margin: 3rem auto 0; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<header>
  <h1><!--TITLE--></h1>
  <p class="subtitle"><!--SUBTITLE--></p>
</header>
<main>
<!--CONTENT-->
</main>
<footer><!--FOOTER--></footer>
<!--MERMAID-->
</body>
</html>
